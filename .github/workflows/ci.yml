name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Package Chrome Web Store upload
        run: npm run package

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: undock-engine-dist
          path: dist/
          if-no-files-found: error

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: undock-engine-chrome-web-store
          path: undock-engine-v*.zip
          if-no-files-found: error
